<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eff5ef"><title>校园生活账本</title><link rel="stylesheet" href="./style.css"></head><body><main>
<header><div><span class="eyebrow">CAMPUS DAYS</span><h1>校园生活账本</h1><p id="motto">每一点积累，都在悄悄生长。</p></div><button id="refresh" aria-label="刷新账本"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 8a7 7 0 0 1 12-2L20 9M4 15l2.5 3a7 7 0 0 0 12-2"/></svg></button></header>
<p id="error" role="status" hidden></p>
<section class="balance"><div><span class="label">饭卡余额</span><div id="balance" class="balance-number">—</div><p id="balance-time">等待读取真实余额</p></div><svg class="plant" viewBox="0 0 110 110" fill="none" aria-hidden="true"><path d="M53 91V39" stroke="#7f9d83" stroke-width="2"/><path d="M52 65C19 67 13 44 18 35C43 31 55 49 52 65Z" fill="#abc5ad"/><path d="M54 47C81 48 89 26 83 17C61 17 48 31 54 47Z" fill="#83a68a"/><path d="M38 88H68L64 108H42Z" fill="#c3d4bb"/><path d="M22 103H86" stroke="#b3c9ae" stroke-linecap="round"/></svg></section>
<div class="columns"><div class="left"><section class="week"><div class="section-heading"><h2>这一周</h2><span id="week-range"></span></div><div class="week-card"><div class="week-total"><div><span class="label">饭卡已观测支出</span><strong id="week-spent">—</strong></div><span class="pill">近7天</span></div><div id="chart" class="chart" role="img" aria-label="最近七天饭卡已观测支出"></div><p id="week-note" class="hint">缺少记录的日期留空，不当作零消费。</p></div></section>
<div class="today-grid"><section class="mini"><span class="label">今日饭卡支出</span><strong id="today-spent">—</strong><span class="hint">余额差推算</span></section><section class="mini"><span class="label">今日直饮机消费</span><strong id="water-spent">—</strong><span id="water-note" class="hint">仅按已采集账单</span></section></div>
</div><section class="recent"><div class="section-heading"><h2>最近消费</h2><span id="records-count"></span></div><div class="filters" aria-label="消费类型"><button class="active" data-kind="all" aria-pressed="true">全部</button><button data-kind="campus" aria-pressed="false">饭卡</button><button data-kind="water" aria-pressed="false">饮水与生活</button></div><p id="data-note" class="data-note" hidden></p><div id="records" class="records"><p class="empty">正在读取账本…</p></div><button id="more" class="more" hidden>查看更多</button></section></div>
<footer><p id="updated"></p><details><summary>数据说明与导出</summary><p>饭卡消费按两次余额及已确认入账推算，跨时段金额不拆成单笔交易。缺少记录不代表没有消费。饮水账单金额不代表实际饮水量。</p><p id="source-note"></p><div class="exports"><a href="./export.csv" download>饭卡支出 CSV</a><a href="./life-export.csv" download>生活记录 CSV</a><a href="./snapshot.json" download>保存账本副本</a></div></details><span class="closing">小小日常，慢慢记录。</span></footer>
</main><script type="module" src="./app.js"></script></body></html>
